<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Hand-drawn computer and technology doodles</title>
  <desc id="desc">A loose sage-green sketch collage of a laptop, code, browser window, globe, cloud, email, chart and connected devices.</desc>
  <g stroke="#829477" stroke-linecap="round" stroke-linejoin="round">
