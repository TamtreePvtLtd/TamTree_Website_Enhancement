    <!-- bar chart, idea spark and arrows -->
    <g stroke-width="2.8">
      <path d="M235 367v-23h18v23m9 0v-38h18v38m9 0v-54h18v54m-76 7h87"/>
      <path d="m207 195 13-11 12 4m-12-4 1 13m319 106 15-12 15 2m-15-2 2 13"/>
      <path d="M205 69v16m-8-8h16m293 283v13m-7-7h14m-424-95v13m-7-7h14" stroke-width="2.3"/>
      <path d="M211 287c9-5 17-6 25-4m-9-7 10 7-9 7m324 83c11 3 21 3 31 0" stroke-width="2.1"/>
    </g>
    <g fill="#829477" stroke="none" opacity=".74">
      <circle cx="212" cy="96" r="2.5"/><circle cx="231" cy="83" r="3"/><circle cx="485" cy="88" r="2.5"/>
      <circle cx="208" cy="267" r="2"/><circle cx="508" cy="269" r="3"/><circle cx="514" cy="377" r="2.4"/>
      <circle cx="54" cy="210" r="2.5"/><circle cx="653" cy="197" r="2.3"/>
    </g>
  </g>
</svg>
